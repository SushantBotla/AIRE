name: Validate AIRE
on:
  push:
    branches: [mlh-readiness-2026]
  pull_request:
    branches: [main]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Test recommendation logic
        run: npm test
      - name: Typecheck and build
        run: npm run build
